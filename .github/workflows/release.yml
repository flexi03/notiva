name: Release

# A tag like v1.2.3 builds the apps for macOS, Windows and Linux and attaches them to the GitHub
# release of that tag. Notiva checks these releases and updates itself.
on:
  push:
    tags: ['v*']
  # By hand for an existing tag (Actions → Release → Run workflow).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag, z. B. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build && npm run electron:build && npm run mcp:build
      # macOS: signed with the Developer ID and notarized when the secrets are set (see
      # docs/SIGNIEREN.md); otherwise an ad-hoc signature – without one macOS calls the download "damaged".
      - name: Build the apps
        shell: bash
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          extra=()
          if [ "$RUNNER_OS" = macOS ]; then
            if [ -n "$MAC_CERTIFICATE" ]; then
              # Our own keychain with the certificate (electron-builder's temporary one could not be
              # unlocked on the runner); electron-builder then finds the Developer ID by itself.
              KEYCHAIN="$RUNNER_TEMP/notiva.keychain-db"
              KEYCHAIN_PW=$(openssl rand -hex 24)
              printf '%s' "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
              security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
              security set-keychain-settings -lut 21600 "$KEYCHAIN"
              security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
              security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERTIFICATE_PASSWORD" -f pkcs12 -k "$KEYCHAIN" \
                -T /usr/bin/codesign -T /usr/bin/security
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
              security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
              rm -f "$RUNNER_TEMP/cert.p12"
              security find-identity -v -p codesigning "$KEYCHAIN"
              if [ -n "$APPLE_API_KEY_P8" ]; then
                printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
                export APPLE_API_KEY="$RUNNER_TEMP/notary.p8"
              else
                echo "::warning::Signiert, aber nicht notarisiert: APPLE_API_KEY fehlt."
                extra+=(-c.mac.notarize=false)
              fi
            else
              echo "::warning::Kein Apple-Zertifikat (MAC_CERTIFICATE): nur Ad-hoc-Signatur."
              extra+=(-c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false)
            fi
          fi
          npx electron-builder ${{ matrix.target }} --publish never "${extra[@]}"
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Notiva ${TAG#v}" --notes "Siehe CHANGELOG.md" || true
          shopt -s nullglob
          gh release upload "$TAG" release/Notiva-${TAG#v}-*.{dmg,zip,exe,AppImage} --clobber
